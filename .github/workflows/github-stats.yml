# Redraws the GitHub widget (assets/widget-github-*.svg) once a day from the GraphQL API, so the README never depends
# on a shared third-party stats service. Uses only this run's GITHUB_TOKEN and public data; commits only when the
# widget changed. The token widget is refreshed from Ethan's laptop instead (tools/refresh-tokens.py).
name: GitHub stats widget

on:
  schedule:
    - cron: "17 19 * * *"        # 03:17 in Singapore
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: github-stats
  cancel-in-progress: false

jobs:
  redraw:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "fonttools>=4.50,<5"
      - name: Read the numbers and redraw
        run: python tools/gh_stats.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- data/github.json assets/widget-github-dark.svg assets/widget-github-light.svg
          if git diff --cached --quiet; then echo "No change."; exit 0; fi
          git commit -m "GitHub widget: daily redraw"
          git pull --rebase origin main
          git push origin HEAD:main
