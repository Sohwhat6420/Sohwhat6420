# Rebuilds the README banner once a day with fresh GitHub numbers and publishes it to the `live` branch, so the
# GitHub cards stay current even on days the laptop is off. It reads only public data with this run's GITHUB_TOKEN.
# The Claude numbers (usage limits, Claude Code activity) only exist on Ethan's laptop: this keeps the last copies the
# laptop published (tools/refresh.py) and redraws them as they are. Main is never written; each run adds one commit
# to `live` (an ordinary push).
name: Banner (daily)

on:
  schedule:
    - cron: "17 19 * * *"        # 03:17 in Singapore
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: banner
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "fonttools>=4.50,<5" "pillow>=10,<12"
      - name: Rebuild and publish
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python tools/refresh.py --ci
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
