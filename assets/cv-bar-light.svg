<circle cx="58" cy="70.0" r="34" fill="url(#gl)"/>
<circle cx="58" cy="70.0" r="22" fill="#8a6a12" fill-opacity=".1" stroke="#8a6a12" stroke-opacity=".55"/>
<circle class="orbit" cx="58" cy="70.0" r="22" fill="none" stroke="url(#ring)" stroke-width="1.8"/>
<g class="arrow" fill="none" stroke="#8a6a12" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="M58 60.0v14M52 68.0l6 6 6-6"/><path d="M51 79.0h14"/></g>
<text x="100" y="67.0" font-size="19" font-weight="700" fill="#1f2328">Download my CV</text>
