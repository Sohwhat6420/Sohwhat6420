<svg xmlns="http://www.w3.org/2000/svg" width="830" height="134" viewBox="0 0 830 134" role="img" aria-labelledby="t d">
<title id="t">Download CV (PDF)</title><desc id="d">Button. Download Ethan Soh's full CV as a PDF, 2 pages.</desc><style><![CDATA[
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
.arrow{animation:nudge 2.4s ease-in-out infinite}
.sweep{animation:sweep 6.5s cubic-bezier(.45,0,.25,1) infinite}
.orbit{animation:orbit 4.8s linear infinite;transform-box:fill-box;transform-origin:center}
@keyframes nudge{0%,70%,100%{transform:translateY(0)}35%{transform:translateY(2.5px)}}
@keyframes sweep{0%,55%{transform:translateX(-30%)}100%{transform:translateX(130%)}}
@keyframes orbit{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
]]></style>
<defs>
<filter id="sh" x="-10%" y="-40%" width="120%" height="200%"><feGaussianBlur stdDeviation="9"/></filter>
