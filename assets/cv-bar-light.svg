<linearGradient id="top" x1="0" x2="1"><stop offset="0" stop-color="#8a6a12" stop-opacity="0"/><stop offset=".2" stop-color="#8a6a12" stop-opacity=".9"/><stop offset=".75" stop-color="#8a6a12" stop-opacity="0.36"/><stop offset="1" stop-color="#8a6a12" stop-opacity="0"/></linearGradient>
<linearGradient id="sw" x1="0" x2="1"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#e8c873" stop-opacity=".18"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
<radialGradient id="gl" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#b8922e" stop-opacity=".28"/><stop offset="1" stop-color="#b8922e" stop-opacity="0"/></radialGradient>
<linearGradient id="ring" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#b8922e" stop-opacity=".95"/><stop offset=".35" stop-color="#b8922e" stop-opacity="0"/><stop offset="1" stop-color="#b8922e" stop-opacity="0"/></linearGradient>
<clipPath id="c"><rect x="1" y="29" width="828" height="82" rx="20"/></clipPath>
</defs>
<rect x="12" y="39" width="806" height="76" rx="20" fill="#1f2328" fill-opacity=".12" filter="url(#sh)"/>
<rect x="1" y="29" width="828" height="82" rx="20" fill="#ffffff" fill-opacity=".72"/>
<g clip-path="url(#c)"><rect x="0" y="29" width="830" height="82" fill="url(#hi)"/><g class="sweep"><rect x="0" y="29" width="290" height="82" fill="url(#sw)" transform="skewX(-18)"/></g></g>
<rect x="1.5" y="29.5" width="827" height="81" rx="20" fill="none" stroke="#8a6a12" stroke-opacity=".38"/>
